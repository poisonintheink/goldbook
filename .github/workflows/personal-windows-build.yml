# It builds upstream main on GitHub's Windows runner and publishes the .exe as a release
# in your fork, so it never expires. Personal use only; do not share the release.
name: Personal Windows build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0'   # Sundays 18:17 UTC = Mondays ~05:17 AEDT

permissions:
  contents: write           # needed to create the release in your fork

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jkc-be/goldbook   # always build the author's current main
          ref: main
          persist-credentials: false

      - name: Resolve version and commit
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ver=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this commit is already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.meta.outputs.ver }}-${{ steps.meta.outputs.sha }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned Rust toolchain
        if: steps.exists.outputs.skip != 'true'
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        if: steps.exists.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: '22.18'
          cache: npm

      - name: Build the NSIS installer
        if: steps.exists.outputs.skip != 'true'
        run: |
          npm ci
          npm run desktop:pack -- --ci --bundles nsis

      - name: Publish as a release in this fork
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.exists.outputs.tag }}" target/release/bundle/nsis/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Goldbook ${{ steps.meta.outputs.ver }} (${{ steps.meta.outputs.sha }})" \
            --notes "Personal build of jkc-be/goldbook@${{ steps.meta.outputs.sha }}. Not for redistribution."
